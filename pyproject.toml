[project]
name = "oura-mcp"
version = "0.1.0"
description = "Self-hosted MCP server exposing Oura Ring data to Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "jsonschema>=4",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not docker' --timeout=15 --cov=oura_mcp.client --cov=oura_mcp.tools --cov-report=term-missing --cov-fail-under=98"
testpaths = ["tests"]
markers = [
    "docker: requires `docker compose up` and real localhost network access; skipped by default",
    "slow: slower tests not run by default",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"
