# Oura MCP server.
# The Python package lives in ./src (oura_mcp) and is bind-mounted in;
# dependencies come from the pinned requirements.lock, also bind-mounted.
# No Dockerfile: this stays a stock python:3.12-slim image, same as upstream.
#
# 1. cp .env.example .env and fill in the two tokens.
# 2. docker compose up -d
# (pip installs at container start, ~30s; subsequent restarts re-install
#  unless you keep the pip cache volume below.)

services:
  oura-mcp:
    image: python:3.12-slim
    container_name: oura-mcp
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir --root-user-action=ignore
      -r /app/requirements.lock && exec uvicorn
      oura_mcp.server:app --host 0.0.0.0 --port 8000"
    environment:
      # Values come from .env (see .env.example). `:?` fails fast if unset.
      OURA_ACCESS_TOKEN: ${OURA_ACCESS_TOKEN:?Set OURA_ACCESS_TOKEN in .env (see .env.example)}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env (see .env.example)}
      OURA_TIMEOUT: ${OURA_TIMEOUT:-30}
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
      - ./requirements.lock:/app/requirements.lock:ro
      - pip-cache:/root/.cache/pip
    ports:
      # Loopback-only by default; set OURA_MCP_BIND=0.0.0.0 only if your
      # reverse proxy / tunnel runs on a different machine.
      - "${OURA_MCP_BIND:-127.0.0.1}:${OURA_MCP_PORT:-8000}:8000"
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx,os,sys; sys.exit(0 if
          httpx.get('http://127.0.0.1:8000/health',
          headers={'Authorization':'Bearer '+os.environ['MCP_AUTH_TOKEN']},
          timeout=5).json().get('oura_api') else 1)
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
volumes:
  pip-cache: null
networks: {}
